<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="gestionTitle">
  <title id="gestionTitle">Vista previa de Gestión Escolar</title>
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2d48"/>
      <stop offset="100%" stop-color="#123a5e"/>
    </linearGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9f1a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff9f1a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lineFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c2d48" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0c2d48" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0c2d48" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad2)"/>
  <circle cx="120" cy="70" r="220" fill="url(#glow2)"/>
  <circle cx="700" cy="540" r="180" fill="url(#glow2)"/>

  <!-- App window -->
  <g filter="url(#softShadow2)">
    <rect x="70" y="70" width="660" height="460" rx="24" fill="#ffffff"/>
  </g>
  <circle cx="102" cy="98" r="7" fill="#ff9f1a"/>
  <circle cx="126" cy="98" r="7" fill="#e6f0ff"/>
  <circle cx="150" cy="98" r="7" fill="#e6f0ff"/>
  <text x="400" y="103" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0c2d48">Panel de Gestión Escolar</text>
  <line x1="70" y1="126" x2="730" y2="126" stroke="#e6f0ff" stroke-width="2"/>

  <!-- KPI cards -->
  <g>
    <rect x="98" y="150" width="182" height="92" rx="16" fill="#f3f6f9"/>
    <text x="118" y="182" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#0c2d48">94%</text>
    <text x="118" y="204" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b7186">Asistencia general</text>
    <path d="M228 178 l8 -10 l8 10" stroke="#ff9f1a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="304" y="150" width="182" height="92" rx="16" fill="#f3f6f9"/>
    <text x="324" y="182" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#0c2d48">1,240</text>
    <text x="324" y="204" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b7186">Alumnos activos</text>
    <path d="M450 178 l8 -10 l8 10" stroke="#ff9f1a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="510" y="150" width="182" height="92" rx="16" fill="#f3f6f9"/>
    <text x="530" y="182" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#0c2d48">88%</text>
    <text x="530" y="204" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b7186">Cumplimiento curricular</text>
    <path d="M656 178 l8 -10 l8 10" stroke="#ff9f1a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bar chart -->
  <g>
    <text x="98" y="270" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0c2d48" letter-spacing="1" opacity="0.6">DESEMPEÑO POR GRADO</text>
    <line x1="98" y1="470" x2="486" y2="470" stroke="#e6f0ff" stroke-width="2"/>
    <!-- baseline y=470, bars grow upward -->
    <rect x="110" y="398" width="42" height="72" rx="6" fill="#ff9f1a"/>
    <rect x="170" y="358" width="42" height="112" rx="6" fill="#ff9f1a"/>
    <rect x="230" y="320" width="42" height="150" rx="6" fill="#ff9f1a"/>
    <rect x="290" y="372" width="42" height="98" rx="6" fill="#ff9f1a"/>
    <rect x="350" y="340" width="42" height="130" rx="6" fill="#ff9f1a"/>
    <rect x="410" y="388" width="42" height="82" rx="6" fill="#ff9f1a"/>
    <text x="131" y="488" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b7186">1°</text>
    <text x="191" y="488" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b7186">2°</text>
    <text x="251" y="488" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b7186">3°</text>
    <text x="311" y="488" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b7186">4°</text>
    <text x="371" y="488" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b7186">5°</text>
    <text x="431" y="488" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b7186">6°</text>
  </g>

  <!-- Trend line panel -->
  <g>
    <rect x="510" y="252" width="182" height="242" rx="16" fill="#f3f6f9"/>
    <text x="530" y="282" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0c2d48" opacity="0.7">TENDENCIA DE ASISTENCIA</text>
    <path d="M530 420 Q 560 440 590 400 T 650 380 T 672 340" fill="none" stroke="url(#lineFill)" stroke-width="0"/>
    <path d="M530 420 Q 560 440 590 400 T 650 380 T 672 340 L 672 460 L 530 460 Z" fill="url(#lineFill)"/>
    <path d="M530 420 Q 560 440 590 400 T 650 380 T 672 340" fill="none" stroke="#0c2d48" stroke-width="3" stroke-linecap="round"/>
    <circle cx="672" cy="340" r="6" fill="#ff9f1a"/>
    <text x="672" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0c2d48">94%</text>
    <text x="530" y="478" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#5b7186">Últimos 6 meses</text>
  </g>
</svg>
