<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="eiaTitle">
  <title id="eiaTitle">Vista previa del Sistema de Análisis Pedagógico con IA</title>
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2d48"/>
      <stop offset="100%" stop-color="#123a5e"/>
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9f1a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff9f1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0c2d48" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad4)"/>
  <circle cx="700" cy="60" r="220" fill="url(#glow4)"/>
  <circle cx="70" cy="560" r="180" fill="url(#glow4)"/>

  <!-- App window -->
  <g filter="url(#softShadow4)">
    <rect x="70" y="70" width="660" height="460" rx="24" fill="#ffffff"/>
  </g>
  <circle cx="102" cy="98" r="7" fill="#ff9f1a"/>
  <circle cx="126" cy="98" r="7" fill="#e6f0ff"/>
  <circle cx="150" cy="98" r="7" fill="#e6f0ff"/>
  <text x="400" y="103" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0c2d48">Análisis Pedagógico IA</text>
  <line x1="70" y1="126" x2="730" y2="126" stroke="#e6f0ff" stroke-width="2"/>

  <!-- Left: upload + summary -->
  <rect x="98" y="150" width="230" height="96" rx="16" fill="#f3f6f9" stroke="#0c2d48" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="6 6"/>
  <path d="M213 188 v22 M205 202 l8 8 l8 -8" stroke="#0c2d48" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M195 188 a14 14 0 0 1 6 -21 a18 18 0 0 1 34 4 a12 12 0 0 1 -2 23 h-38 a10 10 0 0 1 0 -6 z" fill="#0c2d48" opacity="0.85"/>
  <text x="213" y="228" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#0c2d48">Arrastra la evaluación</text>
  <text x="213" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5b7186">.xlsx o .csv por grupo</text>

  <text x="98" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0c2d48" letter-spacing="1" opacity="0.6">RESULTADOS DEL GRUPO</text>
  <rect x="98" y="286" width="230" height="86" rx="16" fill="#f3f6f9"/>
  <text x="118" y="310" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#5b7186">Avance general</text>
  <rect x="118" y="320" width="190" height="14" rx="7" fill="#ffffff"/>
  <rect x="118" y="320" width="118" height="14" rx="7" fill="#2e7d32"/>
  <rect x="236" y="320" width="54" height="14" fill="#ff9f1a"/>
  <rect x="118" y="320" width="0" height="14"/>
  <rect x="290" y="320" width="18" height="14" rx="7" fill="#d32f2f"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5b7186">
    <circle cx="122" cy="352" r="4" fill="#2e7d32"/><text x="130" y="356">Logrado 62%</text>
    <circle cx="205" cy="352" r="4" fill="#ff9f1a"/><text x="213" y="356">En proceso 28%</text>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5b7186">
    <circle cx="122" cy="365" r="4" fill="#d32f2f"/><text x="130" y="369">Requiere apoyo 10%</text>
  </g>

  <rect x="98" y="386" width="230" height="96" rx="16" fill="#0c2d48"/>
  <path d="M213 406 l4 9 l9 4 l-9 4 l-4 9 l-4 -9 l-9 -4 l9 -4 z" fill="#ff9f1a"/>
  <text x="232" y="415" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#ffffff">Generado con IA</text>
  <text x="118" y="442" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#e6f0ff" opacity="0.85">"Reforzar comprensión de</text>
  <text x="118" y="456" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#e6f0ff" opacity="0.85">gráficas y lenguaje matemático</text>
  <text x="118" y="470" font-family="Arial, Helvetica, sans-serif" font-size="10" fill="#e6f0ff" opacity="0.85">con material concreto."</text>

  <!-- Right: student list -->
  <text x="356" y="156" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0c2d48" letter-spacing="1" opacity="0.6">LISTADO POR ESTUDIANTE</text>

  <rect x="356" y="170" width="346" height="52" rx="12" fill="#f3f6f9"/>
  <circle cx="380" cy="196" r="14" fill="#e6f0ff"/>
  <text x="380" y="200" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#0c2d48">A1</text>
  <text x="404" y="193" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#0c2d48">Estudiante A1</text>
  <text x="404" y="207" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5b7186">Matemáticas · Lenguajes</text>
  <rect x="600" y="184" width="82" height="24" rx="12" fill="#e8f5e9"/>
  <circle cx="614" cy="196" r="4" fill="#2e7d32"/>
  <text x="624" y="200" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#2e7d32">LOGRADO</text>

  <rect x="356" y="230" width="346" height="52" rx="12" fill="#f3f6f9"/>
  <circle cx="380" cy="256" r="14" fill="#e6f0ff"/>
  <text x="380" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#0c2d48">A2</text>
  <text x="404" y="253" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#0c2d48">Estudiante A2</text>
  <text x="404" y="267" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5b7186">Ética · Sociedades</text>
  <rect x="592" y="244" width="90" height="24" rx="12" fill="#fff3e0"/>
  <circle cx="606" cy="256" r="4" fill="#ff9f1a"/>
  <text x="616" y="260" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#8a4b00">EN PROCESO</text>

  <rect x="356" y="290" width="346" height="52" rx="12" fill="#f3f6f9"/>
  <circle cx="380" cy="316" r="14" fill="#e6f0ff"/>
  <text x="380" y="320" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#0c2d48">A3</text>
  <text x="404" y="313" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#0c2d48">Estudiante A3</text>
  <text x="404" y="327" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5b7186">De lo Humano y Comunitario</text>
  <rect x="590" y="304" width="92" height="24" rx="12" fill="#fdecea"/>
  <circle cx="604" cy="316" r="4" fill="#d32f2f"/>
  <text x="614" y="320" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#d32f2f">REQUIERE APOYO</text>

  <rect x="356" y="350" width="346" height="52" rx="12" fill="#f3f6f9"/>
  <circle cx="380" cy="376" r="14" fill="#e6f0ff"/>
  <text x="380" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#0c2d48">A4</text>
  <text x="404" y="373" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#0c2d48">Estudiante A4</text>
  <text x="404" y="387" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5b7186">Matemáticas · Ciencias</text>
  <rect x="600" y="364" width="82" height="24" rx="12" fill="#e8f5e9"/>
  <circle cx="614" cy="376" r="4" fill="#2e7d32"/>
  <text x="624" y="380" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="700" fill="#2e7d32">LOGRADO</text>

  <!-- footer -->
  <rect x="356" y="410" width="346" height="72" rx="16" fill="#f3f6f9"/>
  <path d="M378 434 h14 M378 440 h14 M378 446 h9" stroke="#0c2d48" stroke-width="2.5" stroke-linecap="round"/>
  <text x="404" y="440" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#0c2d48">Informe pedagógico en PDF</text>
  <text x="404" y="454" font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#5b7186">Listo para compartir con el colectivo docente</text>
  <rect x="590" y="428" width="92" height="30" rx="15" fill="#ff9f1a"/>
  <text x="636" y="447" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#0c2d48">DESCARGAR</text>
</svg>
