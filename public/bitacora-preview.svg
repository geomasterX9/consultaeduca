<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="bitacoraTitle">
  <title id="bitacoraTitle">Vista previa de Bitácora Digital Docente</title>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2d48"/>
      <stop offset="100%" stop-color="#123a5e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9f1a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff9f1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0c2d48" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <circle cx="680" cy="60" r="220" fill="url(#glow)"/>
  <circle cx="60" cy="560" r="160" fill="url(#glow)"/>

  <!-- App window -->
  <g filter="url(#softShadow)">
    <rect x="70" y="70" width="660" height="460" rx="24" fill="#ffffff"/>
  </g>

  <!-- Window title bar -->
  <rect x="70" y="70" width="660" height="56" rx="24" fill="#ffffff"/>
  <rect x="70" y="102" width="660" height="24" fill="#ffffff"/>
  <circle cx="102" cy="98" r="7" fill="#ff9f1a"/>
  <circle cx="126" cy="98" r="7" fill="#e6f0ff"/>
  <circle cx="150" cy="98" r="7" fill="#e6f0ff"/>
  <text x="400" y="103" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#0c2d48">Bitácora Digital Docente</text>
  <line x1="70" y1="126" x2="730" y2="126" stroke="#e6f0ff" stroke-width="2"/>

  <!-- Sidebar -->
  <rect x="70" y="126" width="88" height="404" fill="#f3f6f9"/>
  <rect x="94" y="164" width="40" height="40" rx="12" fill="#0c2d48"/>
  <path d="M104 184 l8 8 l16 -18" stroke="#ff9f1a" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="94" y="222" width="40" height="40" rx="12" fill="#e6f0ff"/>
  <rect x="104" y="234" width="20" height="4" rx="2" fill="#0c2d48"/>
  <rect x="104" y="244" width="20" height="4" rx="2" fill="#0c2d48"/>
  <rect x="94" y="280" width="40" height="40" rx="12" fill="#e6f0ff"/>
  <path d="M104 310 l6 -14 l6 10 l6 -18 l6 22" stroke="#0c2d48" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Calendar widget -->
  <rect x="590" y="150" width="110" height="98" rx="14" fill="#f3f6f9"/>
  <text x="645" y="172" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#0c2d48">SEPTIEMBRE</text>
  <g fill="#0c2d48" opacity="0.55">
    <circle cx="612" cy="196" r="4"/><circle cx="633" cy="196" r="4"/><circle cx="654" cy="196" r="4"/><circle cx="675" cy="196" r="4"/>
    <circle cx="612" cy="215" r="4"/><circle cx="654" cy="215" r="4"/><circle cx="675" cy="215" r="4"/>
  </g>
  <circle cx="633" cy="215" r="9" fill="#ff9f1a"/>
  <text x="633" y="219" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#ffffff">18</text>
  <g fill="#0c2d48" opacity="0.55">
    <circle cx="612" cy="234" r="4"/><circle cx="633" cy="234" r="4"/><circle cx="654" cy="234" r="4"/>
  </g>

  <!-- Log entries list -->
  <text x="182" y="160" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0c2d48" letter-spacing="1" opacity="0.6">SEGUIMIENTO SEMANAL</text>

  <!-- entry 1 -->
  <rect x="182" y="176" width="392" height="66" rx="14" fill="#f3f6f9"/>
  <circle cx="210" cy="209" r="14" fill="#ff9f1a"/>
  <path d="M204 209 l4 5 l9 -10" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="234" y="203" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0c2d48">Lunes · 3° "A" Matemáticas</text>
  <text x="234" y="221" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b7186">Registro de sesión y evidencias cargado</text>
  <rect x="490" y="196" width="72" height="26" rx="13" fill="#e6f0ff"/>
  <text x="526" y="213" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#0c2d48">COMPLETO</text>

  <!-- entry 2 -->
  <rect x="182" y="252" width="392" height="66" rx="14" fill="#f3f6f9"/>
  <circle cx="210" cy="285" r="14" fill="#ff9f1a"/>
  <path d="M204 285 l4 5 l9 -10" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="234" y="279" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0c2d48">Martes · 2° "B" Ciencias</text>
  <text x="234" y="297" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b7186">Observaciones y avances registrados</text>
  <rect x="490" y="272" width="72" height="26" rx="13" fill="#e6f0ff"/>
  <text x="526" y="289" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#0c2d48">COMPLETO</text>

  <!-- entry 3 (pending) -->
  <rect x="182" y="328" width="392" height="66" rx="14" fill="#f3f6f9"/>
  <circle cx="210" cy="361" r="14" fill="none" stroke="#0c2d48" stroke-width="2.5" opacity="0.4"/>
  <text x="234" y="355" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#0c2d48">Miércoles · 1° "C" Español</text>
  <text x="234" y="373" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#5b7186">Pendiente de captura de evidencias</text>
  <rect x="490" y="348" width="72" height="26" rx="13" fill="#ffffff" stroke="#0c2d48" stroke-opacity="0.15" stroke-width="1.5"/>
  <text x="526" y="365" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="700" fill="#5b7186">PENDIENTE</text>

  <!-- progress footer -->
  <rect x="182" y="416" width="392" height="82" rx="16" fill="#0c2d48"/>
  <text x="206" y="448" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Avance de bitácora del mes</text>
  <text x="206" y="470" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#e6f0ff" opacity="0.8">18 de 22 sesiones documentadas</text>
  <rect x="206" y="478" width="344" height="8" rx="4" fill="#ffffff" opacity="0.15"/>
  <rect x="206" y="478" width="266" height="8" rx="4" fill="#ff9f1a"/>
</svg>
